<ion-content class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>⚽ Equipos Registrados</ion-card-title>
      </ion-card-header>
  
      <ion-list>
        <ion-item *ngFor="let e of equipos">
          <ion-label>
            <h2>{{ e.name }}</h2>
            <p>{{ e.city }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card>
  </ion-content>
